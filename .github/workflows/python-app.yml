name: Build Executables

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # ubuntu-20.04 is CRITICAL here. Building on an older Linux ensures 
        # the glibc version is low, making it work on Arch, CachyOS, Fedora, etc.
        os: [ubuntu-20.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies (Linux - Arch/Ubuntu/Universal Prep)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # Added extra X11 libraries so PyInstaller bundles the right GUI dependencies
        sudo apt-get install -y python3-tk python3-dev xclip scrot xvfb libx11-dev x11-utils xdotool libxext-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install tcl-tk

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyautogui pyperclip pyinstaller

    - name: Build executable
      run: |
        pyinstaller --onefile --noconsole --name OpenAutoTyper OpenAutoTyper.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenAutoTyper-${{ matrix.os }}
        path: dist/
