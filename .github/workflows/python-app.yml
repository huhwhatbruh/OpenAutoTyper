name: Build Executables

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev xclip scrot build-essential

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pyautogui pyperclip

      - name: Build executable
        run: |
          pyinstaller --clean --onefile --noconsole --name OpenAutoTyper OpenAutoTyper.py

      - name: Rename build output (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p release
          cp dist/OpenAutoTyper release/OpenAutoTyper-linux

      - name: Rename build output (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/OpenAutoTyper.exe release/OpenAutoTyper-windows.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAutoTyper-${{ matrix.os }}
          path: release/*

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
