name: Build Executables

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            container: ubuntu:22.04
            artifact_name: OpenAutoTyper-linux-ubuntu
            pkg_install: |
              apt-get update && apt-get install -y \
                python3 python3-pip python3-tk python3-dev \
                xclip scrot build-essential

          - distro: debian
            container: debian:bookworm
            artifact_name: OpenAutoTyper-linux-debian
            pkg_install: |
              apt-get update && apt-get install -y \
                python3 python3-pip python3-tk python3-dev \
                xclip scrot build-essential

          - distro: fedora
            container: fedora:latest
            artifact_name: OpenAutoTyper-linux-fedora
            pkg_install: |
              dnf install -y \
                python3 python3-pip python3-tkinter \
                xclip scrot gcc make

          - distro: archlinux
            container: archlinux:latest
            artifact_name: OpenAutoTyper-linux-arch
            pkg_install: |
              pacman -Syu --noconfirm \
                python python-pip tk \
                xclip scrot base-devel

          - distro: opensuse
            container: opensuse/leap:latest
            artifact_name: OpenAutoTyper-linux-opensuse
            pkg_install: |
              zypper install -y \
                python3 python3-pip python3-tk \
                xclip scrot gcc make

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: ${{ matrix.pkg_install }}

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip --break-system-packages || python3 -m pip install --upgrade pip
          pip3 install pyinstaller customtkinter pyautogui pyperclip --break-system-packages || \
          pip3 install pyinstaller customtkinter pyautogui pyperclip

      - name: Build executable
        run: |
          python3 -m PyInstaller --clean --onefile --noconsole \
            --name OpenAutoTyper OpenAutoTyper.py

      - name: Collect artifact
        run: |
          mkdir -p release
          cp dist/OpenAutoTyper release/${{ matrix.artifact_name }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.artifact_name }}

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pyautogui pyperclip

      - name: Build executable
        run: |
          pyinstaller --clean --onefile --noconsole --name OpenAutoTyper OpenAutoTyper.py

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/OpenAutoTyper.exe release/OpenAutoTyper-windows.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAutoTyper-windows
          path: release/OpenAutoTyper-windows.exe

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/OpenAutoTyper-windows.exe
